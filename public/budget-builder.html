<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=estimates-budget.html?mode=budget">
  <title>Redirecting...</title>
  <script>
    // Set budget mode in localStorage and redirect
    localStorage.setItem('estimatesBudgetMode', 'budget');
    // Preserve any query params
    const params = new URLSearchParams(window.location.search);
    params.set('mode', 'budget');
    window.location.replace('estimates-budget.html?' + params.toString());
  </script>
</head>
<body>
  <p>Redirecting to <a href="estimates-budget.html?mode=budget">Estimates & Budgets (Budget Mode)</a>...</p>
</body>
</html>
