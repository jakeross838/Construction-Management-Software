<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fnfkowpdlffzjqtmbnmj.supabase.co">
  <link rel="dns-prefetch" href="https://fnfkowpdlffzjqtmbnmj.supabase.co">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏗️</text></svg>">
  <title>Ross Built - Estimate</title>
  <link rel="stylesheet" href="css/styles.css?v=20260122">
  <style>
    /* Estimate page specific styles */
    .estimate-page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
    }
    .estimate-page-title {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .estimate-page-title h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 600;
    }
    .estimate-job-info {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }
    .estimate-cost-summary {
      display: flex;
      align-items: center;
      gap: 32px;
    }
    .cost-item {
      text-align: right;
    }
    .cost-item-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .cost-item-value {
      font-size: 1.25rem;
      font-weight: 600;
    }
    .cost-item.profit .cost-item-value {
      color: var(--accent-green);
    }
    .cost-item.total .cost-item-value {
      color: var(--accent-blue);
      font-size: 1.5rem;
    }
    .cost-operator {
      font-size: 1.25rem;
      color: var(--text-secondary);
      align-self: center;
    }
    .estimate-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .estimate-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: var(--bg-primary);
      border-bottom: 1px solid var(--border);
    }
    .estimate-toolbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .estimate-toolbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .jump-to-search {
      position: relative;
      width: 300px;
    }
    .jump-to-search input {
      width: 100%;
      padding: 8px 12px 8px 36px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 0.9rem;
    }
    .jump-to-search input::placeholder {
      color: var(--text-secondary);
      font-style: italic;
    }
    .jump-to-search .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
    }
    .estimate-empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
      text-align: center;
    }
    .estimate-empty-icon {
      width: 120px;
      height: 120px;
      background: var(--accent-blue);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      margin-bottom: 24px;
    }
    .estimate-empty-title {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .estimate-empty-subtitle {
      font-size: 0.95rem;
      color: var(--text-secondary);
      margin-bottom: 32px;
      max-width: 500px;
    }
    .estimate-empty-actions {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
    }
    .estimate-empty-divider {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin: 24px 0;
    }
    .estimate-empty-import {
      display: flex;
      gap: 12px;
    }
    .estimate-content {
      padding: 24px;
    }
    .estimate-table-wrap {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .estimate-line-table {
      width: 100%;
      border-collapse: collapse;
    }
    .estimate-line-table thead {
      background: var(--bg-card-elevated);
      border-bottom: 2px solid var(--border);
    }
    .estimate-line-table th {
      padding: 12px;
      text-align: left;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
    }
    .estimate-line-table tbody tr {
      border-bottom: 1px solid var(--border);
    }
    .estimate-line-table tbody tr:hover {
      background: var(--bg-card-elevated);
    }
    .estimate-line-table td {
      padding: 12px;
      font-size: 0.9rem;
    }
    .line-item-description {
      font-weight: 500;
    }
    .line-item-cost-code {
      color: var(--text-secondary);
      font-size: 0.85rem;
    }
    .section-header-row {
      background: var(--bg-card-elevated);
      font-weight: 600;
    }
    .section-header-row td {
      padding: 16px 12px !important;
      border-top: 2px solid var(--border);
      border-bottom: 2px solid var(--border);
    }
    .section-name {
      font-size: 1rem;
      font-weight: 600;
    }
    .section-subtotal {
      float: right;
      color: var(--accent-blue);
      font-weight: 600;
    }
  </style>
</head>
<body data-page-context="job" data-page-id="estimate" data-page-group="precon" data-role-min="pm">
  <div class="app">
    <header class="header">
      <div class="header-top">
        <div class="header-brand">
          <span class="brand-icon">🏗️</span>
          <span class="brand-name">Ross Built</span>
        </div>
        <nav class="main-nav"></nav>
        <div class="header-actions">
          <!-- User menu, notifications, etc -->
        </div>
      </div>
      <div class="header-sub">
        <nav class="sub-nav"></nav>
      </div>
    </header>

    <div class="app-body">
      <main class="main">
        <!-- Page Header -->
        <div class="estimate-page-header">
          <div class="estimate-page-title">
            <button class="btn btn-ghost btn-sm" onclick="history.back()" title="Back">
              ← Back
            </button>
            <div>
              <h1>Estimate</h1>
              <div class="estimate-job-info" id="estimateJobInfo">
                <span id="jobName">Select a job from the sidebar</span>
              </div>
            </div>
          </div>

          <div class="estimate-cost-summary" id="costSummary" style="display: none;">
            <div class="cost-item">
              <div class="cost-item-label">Builder cost</div>
              <div class="cost-item-value" id="builderCost">$0.00</div>
            </div>
            <span class="cost-operator">+</span>
            <div class="cost-item profit">
              <div class="cost-item-label">Profit (%)</div>
              <div class="cost-item-value" id="profitPercent">$0.00</div>
            </div>
            <span class="cost-operator">=</span>
            <div class="cost-item total">
              <div class="cost-item-label">Total price</div>
              <div class="cost-item-value" id="totalPrice">$0.00</div>
            </div>
          </div>

          <div class="estimate-actions" id="estimateActions" style="display: none;">
            <button class="btn btn-secondary btn-sm" onclick="exportEstimate()">
              📤 Export
            </button>
            <button class="btn btn-secondary btn-sm" onclick="lockEstimate()">
              🔒 Lock estimate
            </button>
            <button class="btn btn-secondary btn-sm" onclick="sendToBudget()">
              📊 Send to budget
            </button>
            <button class="btn btn-primary btn-sm" onclick="createProposal()">
              + Proposal
            </button>
          </div>
        </div>

        <!-- Toolbar -->
        <div class="estimate-toolbar" id="estimateToolbar" style="display: none;">
          <div class="estimate-toolbar-left">
            <button class="btn btn-secondary btn-sm" onclick="expandAll()">
              📂 Expand all
            </button>
            <div class="jump-to-search">
              <span class="search-icon">🔍</span>
              <input type="text" placeholder="Jump to line items or groups..." id="jumpToSearch">
            </div>
          </div>
          <div class="estimate-toolbar-right">
            <button class="btn btn-secondary btn-sm" onclick="showSettings()">
              ⚙️
            </button>
          </div>
        </div>

        <!-- Empty State -->
        <div class="estimate-empty-state" id="emptyState">
          <div class="estimate-empty-icon">🧮</div>
          <div class="estimate-empty-title">Add an estimate</div>
          <div class="estimate-empty-subtitle">
            Estimate the cost of the job, turn it into a proposal, and send it straight to your clients.
          </div>
          <div class="estimate-empty-actions">
            <button class="btn btn-primary" onclick="addLineItem()">
              ➕ Add item
            </button>
            <button class="btn btn-secondary" onclick="addGroup()">
              📁 Add group
            </button>
            <button class="btn btn-secondary" onclick="setProfitAndTax()">
              📊 Set profit and tax
            </button>
          </div>
          <div class="estimate-empty-divider">or</div>
          <div class="estimate-empty-import">
            <button class="btn btn-ghost" onclick="importFromExcel()">
              📊 Excel
            </button>
            <button class="btn btn-ghost" onclick="importFromTemplate()">
              📋 Template
            </button>
          </div>
        </div>

        <!-- Estimate Content (hidden until estimate exists) -->
        <div class="estimate-content" id="estimateContent" style="display: none;">
          <div class="estimate-table-wrap">
            <table class="estimate-line-table">
              <thead>
                <tr>
                  <th style="width: 40px;">#</th>
                  <th style="width: 100px;">Cost Code</th>
                  <th>Description</th>
                  <th style="width: 100px;">Qty</th>
                  <th style="width: 80px;">Unit</th>
                  <th style="width: 120px;">Unit Cost</th>
                  <th style="width: 140px; text-align: right;">Amount</th>
                  <th style="width: 60px;"></th>
                </tr>
              </thead>
              <tbody id="estimateLinesBody">
                <!-- Lines populated by JavaScript -->
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/toasts.js?v=20260122"></script>
  <script src="js/nav-sidebar.js?v=20260122"></script>
  <script src="js/sidebar.js?v=20260122"></script>
  <script>
    // State
    let currentJobId = null;
    let currentEstimate = null;
    let costCodes = [];

    // Initialize
    document.addEventListener('DOMContentLoaded', async () => {
      // Load cost codes
      await loadCostCodes();

      // Listen to sidebar job changes
      if (window.JobSidebar) {
        window.JobSidebar.onJobChange(async (jobId) => {
          currentJobId = jobId;
          if (jobId) {
            await loadEstimateForJob(jobId);
          } else {
            showNoJobSelected();
          }
        });

        // Get initial job
        currentJobId = window.JobSidebar.getSelectedJobId();
        if (currentJobId) {
          await loadEstimateForJob(currentJobId);
        } else {
          showNoJobSelected();
        }
      }
    });

    async function loadCostCodes() {
      try {
        const response = await fetch('/api/cost-codes');
        if (response.ok) {
          costCodes = await response.json();
        }
      } catch (err) {
        console.error('Failed to load cost codes:', err);
      }
    }

    async function loadEstimateForJob(jobId) {
      try {
        // Fetch estimate for this job
        const response = await fetch(`/api/estimates/job/${jobId}`);

        if (response.ok) {
          currentEstimate = await response.json();
          showEstimate(currentEstimate);
        } else if (response.status === 404) {
          // No estimate exists for this job
          currentEstimate = null;
          showEmptyState();
        } else {
          throw new Error('Failed to load estimate');
        }
      } catch (err) {
        console.error('Error loading estimate:', err);
        showToast('Failed to load estimate', 'error');
      }
    }

    function showNoJobSelected() {
      document.getElementById('jobName').textContent = 'Select a job from the sidebar';
      document.getElementById('costSummary').style.display = 'none';
      document.getElementById('estimateActions').style.display = 'none';
      document.getElementById('estimateToolbar').style.display = 'none';
      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('estimateContent').style.display = 'none';
    }

    function showEmptyState() {
      // Update job name
      const job = window.JobSidebar?.getSelectedJob();
      document.getElementById('jobName').textContent = job ? `JOB: ${job.name}` : 'Select a job';

      // Hide cost summary and actions
      document.getElementById('costSummary').style.display = 'none';
      document.getElementById('estimateActions').style.display = 'none';
      document.getElementById('estimateToolbar').style.display = 'none';

      // Show empty state
      document.getElementById('emptyState').style.display = 'flex';
      document.getElementById('estimateContent').style.display = 'none';
    }

    function showEstimate(estimate) {
      // Update job name
      const job = window.JobSidebar?.getSelectedJob();
      document.getElementById('jobName').textContent = job ? `JOB: ${job.name} / ESTIMATE` : 'Estimate';

      // Show cost summary
      const builderCost = estimate.subtotal || 0;
      const profitAmount = estimate.profit_amount || 0;
      const profitPercent = estimate.profit_percent || 0;
      const totalPrice = estimate.total_amount || 0;

      document.getElementById('builderCost').textContent = formatCurrency(builderCost);
      document.getElementById('profitPercent').textContent = `${profitPercent.toFixed(1)}% (${formatCurrency(profitAmount)})`;
      document.getElementById('totalPrice').textContent = formatCurrency(totalPrice);
      document.getElementById('costSummary').style.display = 'flex';

      // Show actions
      document.getElementById('estimateActions').style.display = 'flex';
      document.getElementById('estimateToolbar').style.display = 'flex';

      // Hide empty state
      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('estimateContent').style.display = 'block';

      // Render lines
      renderEstimateLines(estimate);
    }

    function renderEstimateLines(estimate) {
      const tbody = document.getElementById('estimateLinesBody');
      const sections = estimate.sections || [];
      const lines = estimate.lines || [];

      if (!lines.length && !sections.length) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 40px;">No line items yet. Click "Add item" to get started.</td></tr>';
        return;
      }

      // Group lines by section
      const linesBySection = {};
      const unsectionedLines = [];

      lines.forEach(line => {
        if (line.section_id) {
          if (!linesBySection[line.section_id]) linesBySection[line.section_id] = [];
          linesBySection[line.section_id].push(line);
        } else {
          unsectionedLines.push(line);
        }
      });

      let html = '';
      let rowNum = 1;

      // Render sections
      sections.forEach(section => {
        const sectionLines = linesBySection[section.id] || [];
        const sectionTotal = sectionLines.reduce((sum, l) => sum + (l.amount || 0), 0);

        html += `
          <tr class="section-header-row">
            <td colspan="8">
              <span class="section-name">${escapeHtml(section.name)}</span>
              <span class="section-subtotal">${formatCurrency(sectionTotal)}</span>
            </td>
          </tr>
        `;

        sectionLines.forEach(line => {
          html += renderLineRow(line, rowNum++);
        });
      });

      // Render unsectioned lines
      unsectionedLines.forEach(line => {
        html += renderLineRow(line, rowNum++);
      });

      tbody.innerHTML = html;
    }

    function renderLineRow(line, rowNum) {
      const costCode = costCodes.find(cc => cc.id === line.cost_code_id);
      return `
        <tr data-line-id="${line.id}">
          <td>${rowNum}</td>
          <td>${costCode ? costCode.code : '-'}</td>
          <td>
            <div class="line-item-description">${escapeHtml(line.description)}</div>
            ${costCode ? `<div class="line-item-cost-code">${escapeHtml(costCode.name)}</div>` : ''}
          </td>
          <td>${line.quantity || '-'}</td>
          <td>${line.unit || '-'}</td>
          <td>${formatCurrency(line.unit_cost)}</td>
          <td style="text-align: right;">${formatCurrency(line.amount)}</td>
          <td>
            <button class="btn btn-ghost btn-sm" onclick="editLine('${line.id}')" title="Edit">✏️</button>
          </td>
        </tr>
      `;
    }

    // Action handlers
    function addLineItem() {
      if (!currentJobId) {
        showToast('Please select a job first', 'warning');
        return;
      }
      showToast('Add line item coming soon', 'info');
    }

    function addGroup() {
      if (!currentJobId) {
        showToast('Please select a job first', 'warning');
        return;
      }
      showToast('Add group coming soon', 'info');
    }

    function setProfitAndTax() {
      if (!currentJobId) {
        showToast('Please select a job first', 'warning');
        return;
      }
      showToast('Set profit and tax coming soon', 'info');
    }

    function importFromExcel() {
      showToast('Import from Excel coming soon', 'info');
    }

    function importFromTemplate() {
      showToast('Import from template coming soon', 'info');
    }

    function exportEstimate() {
      showToast('Export coming soon', 'info');
    }

    function lockEstimate() {
      showToast('Lock estimate coming soon', 'info');
    }

    function sendToBudget() {
      showToast('Send to budget coming soon', 'info');
    }

    function createProposal() {
      showToast('Create proposal coming soon', 'info');
    }

    function expandAll() {
      showToast('Expand all coming soon', 'info');
    }

    function showSettings() {
      showToast('Settings coming soon', 'info');
    }

    function editLine(lineId) {
      showToast('Edit line coming soon', 'info');
    }

    // Utilities
    function formatCurrency(amount) {
      if (amount == null) return '$0.00';
      return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amount);
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
