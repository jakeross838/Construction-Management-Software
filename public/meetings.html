<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fnfkowpdlffzjqtmbnmj.supabase.co">
  <link rel="dns-prefetch" href="https://fnfkowpdlffzjqtmbnmj.supabase.co">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏗️</text></svg>">
  <title>Ross Built - Meetings</title>
  <link rel="stylesheet" href="css/styles.css?v=20260121">
</head>
<body data-page-context="job" data-page-id="meetings" data-page-group="active" data-role-min="pm">
  <div class="app">
    <header class="header">
      <div class="header-top">
        <div class="header-brand">
          <span class="brand-icon">🏗️</span>
          <span class="brand-name">Ross Built</span>
        </div>
        <nav class="main-nav"></nav>
        <div class="header-actions">
          <button class="btn btn-secondary" onclick="showActionItems()">Open Actions</button>
          <button class="btn btn-primary" onclick="openCreateModal()">+ New Meeting</button>
        </div>
      </div>
      <div class="header-sub">
        <nav class="sub-nav"></nav>
      </div>
    </header>

    <div class="app-body">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <h3>Jobs</h3>
        </div>
        <div class="sidebar-search">
          <input type="text" id="jobSearch" placeholder="Search jobs..." class="form-control">
        </div>
        <ul class="sidebar-list" id="jobList">
          <li class="sidebar-item active" data-job-id="">
            <span class="sidebar-item-name">All Jobs</span>
          </li>
        </ul>
      </aside>

      <main class="main">
        <!-- Stats Summary Bar -->
        <div class="stats-bar">
          <div class="stat-item">
            <span class="stat-value" id="statTotal">0</span>
            <span class="stat-label">Total</span>
          </div>
          <div class="stat-item">
            <span class="stat-value stat-scheduled" id="statScheduled">0</span>
            <span class="stat-label">Scheduled</span>
          </div>
          <div class="stat-item">
            <span class="stat-value stat-completed" id="statCompleted">0</span>
            <span class="stat-label">Completed</span>
          </div>
          <div class="stat-item">
            <span class="stat-value stat-warning" id="statActions">0</span>
            <span class="stat-label">Open Actions</span>
          </div>
        </div>

        <!-- Filters -->
        <div class="table-toolbar">
          <div class="filter-controls">
            <select id="typeFilter" class="form-control filter-select">
              <option value="">All Types</option>
              <option value="owner">Owner Meeting</option>
              <option value="subcontractor">Subcontractor Meeting</option>
              <option value="design">Design Meeting</option>
              <option value="site">Site Meeting</option>
              <option value="kickoff">Kickoff</option>
              <option value="closeout">Closeout</option>
            </select>
            <select id="statusFilter" class="form-control filter-select">
              <option value="">All Statuses</option>
              <option value="scheduled">Scheduled</option>
              <option value="in_progress">In Progress</option>
              <option value="completed">Completed</option>
              <option value="cancelled">Cancelled</option>
            </select>
            <input type="date" id="fromDate" class="form-control filter-date" placeholder="From date">
            <input type="date" id="toDate" class="form-control filter-date" placeholder="To date">
          </div>
          <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search meetings..." class="form-control search-input">
            <button class="search-clear-btn" id="searchClear" style="display: none;" onclick="clearSearch()">&times;</button>
          </div>
        </div>

        <!-- Meeting List -->
        <div class="meeting-list" id="meetingList">
          <div class="skeleton-card"><div class="skeleton-line long"></div><div class="skeleton-line medium"></div></div>
          <div class="skeleton-card"><div class="skeleton-line long"></div><div class="skeleton-line medium"></div></div>
          <div class="skeleton-card"><div class="skeleton-line long"></div><div class="skeleton-line medium"></div></div>
        </div>
      </main>
    </div>
  </div>

  <!-- Create/Edit Meeting Modal -->
  <div id="createModal" class="modal">
    <div class="modal-content modal-md">
      <div class="modal-header">
        <h2 id="modalTitle">New Meeting</h2>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="meetingForm">
          <input type="hidden" id="meetingId">

          <div class="form-group">
            <label for="title">Title *</label>
            <input type="text" id="title" class="form-control" required placeholder="Meeting title">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="meetingType">Type</label>
              <select id="meetingType" class="form-control">
                <option value="general">General</option>
                <option value="owner">Owner Meeting</option>
                <option value="subcontractor">Subcontractor Meeting</option>
                <option value="design">Design Meeting</option>
                <option value="site">Site Meeting</option>
                <option value="kickoff">Kickoff</option>
                <option value="closeout">Closeout</option>
              </select>
            </div>
            <div class="form-group">
              <label for="jobSelect">Job</label>
              <select id="jobSelect" class="form-control">
                <option value="">No job linked</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="scheduledDate">Date & Time *</label>
              <input type="datetime-local" id="scheduledDate" class="form-control" required>
            </div>
            <div class="form-group">
              <label for="duration">Duration (min)</label>
              <input type="number" id="duration" class="form-control" min="15" step="15" value="60">
            </div>
          </div>

          <div class="form-group">
            <label for="location">Location</label>
            <input type="text" id="location" class="form-control" placeholder="Meeting location">
          </div>

          <div class="form-group">
            <label for="organizer">Organizer</label>
            <input type="text" id="organizer" class="form-control" placeholder="Who is organizing">
          </div>

          <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" class="form-control" rows="3" placeholder="Meeting description..."></textarea>
          </div>

          <div class="form-group">
            <label for="agenda">Agenda</label>
            <textarea id="agenda" class="form-control" rows="4" placeholder="Meeting agenda..."></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="saveMeeting()">Save Meeting</button>
      </div>
    </div>
  </div>

  <!-- Meeting Detail Modal -->
  <div id="detailModal" class="modal modal-fullscreen-dark">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title-row">
          <h2 id="detailTitle">Meeting Details</h2>
          <div class="modal-badges" id="detailBadges"></div>
        </div>
        <button class="close-btn" onclick="closeDetailModal()">&times;</button>
      </div>
      <div class="modal-tabs">
        <button class="tab active" data-tab="overview">Overview</button>
        <button class="tab" data-tab="agenda">Agenda</button>
        <button class="tab" data-tab="actions">Action Items</button>
        <button class="tab" data-tab="notes">Notes</button>
      </div>
      <div class="modal-body">
        <div id="tab-overview" class="tab-content active"></div>
        <div id="tab-agenda" class="tab-content"></div>
        <div id="tab-actions" class="tab-content"></div>
        <div id="tab-notes" class="tab-content"></div>
      </div>
      <div class="modal-footer" id="detailFooter">
        <button class="btn btn-secondary" onclick="editMeeting()">Edit</button>
        <button class="btn btn-secondary" onclick="addAgendaItem()">+ Agenda Item</button>
        <button class="btn btn-secondary" onclick="addActionItem()">+ Action Item</button>
        <button class="btn btn-primary" onclick="completeMeeting()">Complete Meeting</button>
      </div>
    </div>
  </div>

  <!-- Add Agenda Item Modal -->
  <div id="agendaModal" class="modal">
    <div class="modal-content modal-sm">
      <div class="modal-header">
        <h2>Add Agenda Item</h2>
        <button class="close-btn" onclick="closeAgendaModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="agendaForm">
          <div class="form-group">
            <label for="agendaTitle">Title *</label>
            <input type="text" id="agendaTitle" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="agendaDescription">Description</label>
            <textarea id="agendaDescription" class="form-control" rows="2"></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="agendaPresenter">Presenter</label>
              <input type="text" id="agendaPresenter" class="form-control">
            </div>
            <div class="form-group">
              <label for="agendaDuration">Duration (min)</label>
              <input type="number" id="agendaDuration" class="form-control" min="5" step="5" value="10">
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeAgendaModal()">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="saveAgendaItem()">Add</button>
      </div>
    </div>
  </div>

  <!-- Add Action Item Modal -->
  <div id="actionModal" class="modal">
    <div class="modal-content modal-sm">
      <div class="modal-header">
        <h2>Add Action Item</h2>
        <button class="close-btn" onclick="closeActionModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="actionForm">
          <div class="form-group">
            <label for="actionDescription">Description *</label>
            <textarea id="actionDescription" class="form-control" rows="2" required></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="actionAssignee">Assigned To</label>
              <input type="text" id="actionAssignee" class="form-control">
            </div>
            <div class="form-group">
              <label for="actionDueDate">Due Date</label>
              <input type="date" id="actionDueDate" class="form-control">
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeActionModal()">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="saveActionItem()">Add</button>
      </div>
    </div>
  </div>

  <!-- Open Action Items Modal -->
  <div id="openActionsModal" class="modal modal-fullscreen-dark">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Open Action Items</h2>
        <button class="close-btn" onclick="closeOpenActionsModal()">&times;</button>
      </div>
      <div class="modal-body" id="openActionsList">
        <div class="empty-state">Loading...</div>
      </div>
    </div>
  </div>

  <script src="js/nav-sidebar.js"></script>
  <script src="js/toasts.js"></script>
  <script src="js/meetings.js"></script>
</body>
</html>
