<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messaging | Ross Built CMS</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-top">
        <div class="header-brand">
          <span class="brand-icon">🏗️</span>
          <span class="brand-name">Ross Built</span>
        </div>
        <nav class="main-nav"></nav>
        <div class="header-actions">
          <button class="btn btn-primary" onclick="openNewConversation()">+ New Conversation</button>
        </div>
      </div>
      <div class="header-sub">
        <nav class="sub-nav"></nav>
      </div>
    </header>

    <div class="app-body">
      <main class="main messaging-layout">
        <!-- Conversations Sidebar -->
        <div class="conversations-sidebar">
          <div class="conversations-header">
            <h3>Conversations</h3>
            <span class="unread-badge" id="unreadBadge" style="display: none;">0</span>
          </div>

          <div class="conversations-filters">
            <select id="jobFilter" class="form-select">
              <option value="">All Jobs</option>
            </select>
            <input type="search" id="searchInput" class="form-input" placeholder="Search...">
          </div>

          <div class="conversations-list" id="conversationsList">
            <div class="loading-state">Loading...</div>
          </div>
        </div>

        <!-- Message Area -->
        <div class="message-area" id="messageArea">
          <div class="no-conversation-selected">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            <h3>Select a Conversation</h3>
            <p>Choose a conversation from the list or start a new one.</p>
          </div>

          <!-- Conversation View (hidden by default) -->
          <div class="conversation-view" id="conversationView" style="display: none;">
            <div class="conversation-header">
              <div class="conversation-header-left">
                <h3 id="conversationSubject">Subject</h3>
                <span class="conversation-meta">
                  <span id="conversationJob">Job</span>
                  <span id="conversationParticipants">Participants</span>
                </span>
              </div>
              <div class="conversation-header-right">
                <button class="btn btn-secondary btn-sm" onclick="openConversationSettings()">Settings</button>
              </div>
            </div>

            <div class="messages-container" id="messagesContainer">
              <!-- Messages will be rendered here -->
            </div>

            <div class="message-input-area">
              <textarea id="messageInput" class="form-input" rows="2" placeholder="Type a message..."></textarea>
              <div class="message-input-actions">
                <button class="btn btn-primary" onclick="sendMessage()">Send</button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- New Conversation Modal -->
  <div id="newConversationModal" class="modal modal-centered">
    <div class="modal-content modal-medium">
      <div class="modal-header">
        <h3>New Conversation</h3>
        <button class="modal-close" onclick="closeNewConversationModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="newConversationForm">
          <div class="form-group">
            <label for="convSubject">Subject *</label>
            <input type="text" id="convSubject" class="form-input" required placeholder="Conversation subject">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="convJob">Job</label>
              <select id="convJob" class="form-select">
                <option value="">No Job (General)</option>
              </select>
            </div>
            <div class="form-group">
              <label for="convType">Type</label>
              <select id="convType" class="form-select">
                <option value="general">General</option>
                <option value="job">Job Discussion</option>
                <option value="rfi">RFI</option>
                <option value="submittal">Submittal</option>
                <option value="task">Task</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="convParticipants">Participants</label>
            <input type="text" id="convParticipants" class="form-input" placeholder="e.g., Jake Ross, John Smith (comma-separated)">
          </div>

          <div class="form-group">
            <label for="convFirstMessage">First Message</label>
            <textarea id="convFirstMessage" class="form-input" rows="3" placeholder="Start the conversation..."></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeNewConversationModal()">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="createConversation()">Start Conversation</button>
      </div>
    </div>
  </div>

  <!-- Conversation Settings Modal -->
  <div id="conversationSettingsModal" class="modal modal-centered">
    <div class="modal-content modal-small">
      <div class="modal-header">
        <h3>Conversation Settings</h3>
        <button class="modal-close" onclick="closeConversationSettingsModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="conversationSettingsForm">
          <div class="form-group">
            <label for="settingsSubject">Subject</label>
            <input type="text" id="settingsSubject" class="form-input">
          </div>

          <div class="form-group">
            <label for="settingsParticipants">Participants</label>
            <input type="text" id="settingsParticipants" class="form-input" placeholder="Comma-separated names">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" onclick="archiveConversation()">Archive</button>
        <button type="button" class="btn btn-primary" onclick="saveConversationSettings()">Save</button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <script src="js/toasts.js"></script>
  <script defer src="js/nav-sidebar.js"></script>
  <script defer src="js/sidebar.js"></script>
  <script src="js/messaging.js"></script>
  <script src="js/ai-upload.js"></script>
</body>
</html>
