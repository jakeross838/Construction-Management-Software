<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><text y='32' font-size='32'>🏗️</text></svg>">
  <title>Ross Built - Companies</title>
  <link rel="stylesheet" href="css/styles.css?v=20260119">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-top">
        <div class="header-brand">
          <span class="brand-icon">🏗️</span>
          <span class="brand-name">Ross Built</span>
        </div>
        <nav class="main-nav"></nav>
        <div class="header-actions">
          <button class="btn btn-primary" onclick="openCreateModal()">+ New Company</button>
        </div>
      </div>
    </header>

    <div class="app-body">
      <main class="main">
        <!-- Stats Bar -->
        <div class="page-header-bar">
          <h1 class="page-title">Companies</h1>
          <div class="page-header-stats">
            <div class="stat-chip">
              <span class="stat-chip-value" id="statTotal">0</span>
              <span class="stat-chip-label">Total</span>
            </div>
            <div class="stat-chip">
              <span class="stat-chip-value" id="statActive">0</span>
              <span class="stat-chip-label">Active</span>
            </div>
          </div>
        </div>

        <!-- Toolbar with Filters -->
        <div class="data-toolbar">
          <div class="toolbar-left">
            <div class="filter-group">
              <select id="typeFilter" class="form-control form-control-sm">
                <option value="">All Types</option>
                <option value="client">Client</option>
                <option value="subcontractor">Subcontractor</option>
                <option value="supplier">Supplier</option>
                <option value="architect">Architect</option>
                <option value="engineer">Engineer</option>
                <option value="inspector">Inspector</option>
                <option value="lender">Lender</option>
                <option value="government">Government</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="filter-group">
              <select id="statusFilter" class="form-control form-control-sm">
                <option value="">All Status</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
              </select>
            </div>
            <div class="search-input-wrap">
              <input type="text" id="searchInput" placeholder="Search companies..." class="form-control form-control-sm">
            </div>
          </div>
          <div class="toolbar-right">
            <a href="contacts.html" class="btn btn-secondary btn-sm">View Contacts</a>
          </div>
        </div>

        <!-- Data Table -->
        <div class="data-table-container">
          <table class="data-table" id="companyTable">
            <thead>
              <tr>
                <th>Company Name</th>
                <th>Type</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr><td colspan="5" class="empty-state">Loading companies...</td></tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <!-- Create/Edit Modal -->
  <div id="companyModal" class="modal modal-fullscreen-dark">
    <div class="modal-content" style="max-width: 600px;">
      <div class="modal-header">
        <h2 id="modalTitle">New Company</h2>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="companyForm">
          <input type="hidden" id="companyId">

          <div class="form-group">
            <label for="companyName">Company Name *</label>
            <input type="text" id="companyName" name="name" class="form-control" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="companyType">Type</label>
              <select id="companyType" name="company_type" class="form-control">
                <option value="">-- Select Type --</option>
                <option value="client">Client</option>
                <option value="subcontractor">Subcontractor</option>
                <option value="supplier">Supplier</option>
                <option value="architect">Architect</option>
                <option value="engineer">Engineer</option>
                <option value="inspector">Inspector</option>
                <option value="lender">Lender</option>
                <option value="government">Government Agency</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="form-group">
              <label for="companyPhone">Phone</label>
              <input type="tel" id="companyPhone" name="phone" class="form-control">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="companyEmail">Email</label>
              <input type="email" id="companyEmail" name="email" class="form-control">
            </div>
            <div class="form-group">
              <label for="companyWebsite">Website</label>
              <input type="url" id="companyWebsite" name="website" class="form-control" placeholder="https://">
            </div>
          </div>

          <div class="form-group">
            <label for="companyAddress">Address</label>
            <input type="text" id="companyAddress" name="address" class="form-control">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="companyCity">City</label>
              <input type="text" id="companyCity" name="city" class="form-control">
            </div>
            <div class="form-group" style="width: 100px;">
              <label for="companyState">State</label>
              <input type="text" id="companyState" name="state" class="form-control" maxlength="2">
            </div>
            <div class="form-group" style="width: 120px;">
              <label for="companyZip">ZIP</label>
              <input type="text" id="companyZip" name="zip" class="form-control">
            </div>
          </div>

          <div class="form-group">
            <label for="companyNotes">Notes</label>
            <textarea id="companyNotes" name="notes" class="form-control" rows="3"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="saveCompany()">Save Company</button>
      </div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div id="detailModal" class="modal modal-fullscreen-dark">
    <div class="modal-content" style="max-width: 700px;">
      <div class="modal-header">
        <h2 id="detailTitle">Company Details</h2>
        <button class="close-btn" onclick="closeDetailModal()">&times;</button>
      </div>
      <div class="modal-body" id="detailBody">
        <!-- Populated by JS -->
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeDetailModal()">Close</button>
        <button type="button" class="btn btn-danger" onclick="deleteCurrentCompany()">Delete</button>
        <button type="button" class="btn btn-primary" onclick="editCurrentCompany()">Edit</button>
      </div>
    </div>
  </div>

  <script src="js/nav-sidebar.js"></script>
  <script src="js/toasts.js"></script>
  <script src="js/companies.js"></script>
</body>
</html>
