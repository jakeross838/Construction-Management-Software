<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fnfkowpdlffzjqtmbnmj.supabase.co">
  <link rel="dns-prefetch" href="https://fnfkowpdlffzjqtmbnmj.supabase.co">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏗️</text></svg>">
  <title>Ross Built - Compliance</title>
  <link rel="stylesheet" href="css/styles.css?v=20260121">
</head>
<body data-page-context="job" data-page-id="compliance" data-page-group="active" data-role-min="pm">
  <div class="app">
    <header class="header">
      <div class="header-top">
        <div class="header-brand">
          <span class="brand-icon">🏗️</span>
          <span class="brand-name">Ross Built</span>
        </div>
        <nav class="main-nav"></nav>
        <div class="header-actions">
          <button class="btn btn-secondary" onclick="showCalendar()">Calendar View</button>
          <button class="btn btn-primary" onclick="openCreateModal()">+ New Entry</button>
        </div>
      </div>
      <div class="header-sub">
        <nav class="sub-nav"></nav>
      </div>
    </header>

    <div class="app-body">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <h3>Jobs</h3>
        </div>
        <div class="sidebar-search">
          <input type="text" id="jobSearch" placeholder="Search jobs..." class="form-control">
        </div>
        <ul class="sidebar-list" id="jobList">
          <li class="sidebar-item active" data-job-id="">
            <span class="sidebar-item-name">All Jobs</span>
          </li>
        </ul>
      </aside>

      <main class="main">
        <!-- Compliance Tabs -->
        <div class="page-tabs">
          <button class="page-tab active" data-section="deadlines" onclick="switchSection('deadlines')">Deadlines</button>
          <button class="page-tab" data-section="noas" onclick="switchSection('noas')">NOAs</button>
          <button class="page-tab" data-section="locates" onclick="switchSection('locates')">Utility Locates</button>
        </div>

        <!-- Deadlines Section -->
        <div id="section-deadlines" class="section active">
          <!-- Stats -->
          <div class="stats-bar">
            <div class="stat-item">
              <span class="stat-value stat-danger" id="statOverdue">0</span>
              <span class="stat-label">Overdue</span>
            </div>
            <div class="stat-item">
              <span class="stat-value stat-warning" id="statUrgent">0</span>
              <span class="stat-label">Urgent (7 days)</span>
            </div>
            <div class="stat-item">
              <span class="stat-value stat-info" id="statUpcoming">0</span>
              <span class="stat-label">Upcoming (30 days)</span>
            </div>
            <div class="stat-item">
              <span class="stat-value" id="statFuture">0</span>
              <span class="stat-label">Future</span>
            </div>
          </div>

          <!-- Deadline List -->
          <div class="deadline-list" id="deadlineList">
            <div class="skeleton-card"><div class="skeleton-line long"></div><div class="skeleton-line medium"></div></div>
          </div>
        </div>

        <!-- NOAs Section -->
        <div id="section-noas" class="section" style="display: none;">
          <div class="table-toolbar">
            <div class="filter-controls">
              <select id="noaTypeFilter" class="form-control filter-select">
                <option value="">All Types</option>
                <option value="commencement">Commencement</option>
                <option value="completion">Completion</option>
                <option value="abandonment">Abandonment</option>
                <option value="violation">Violation</option>
              </select>
              <select id="noaStatusFilter" class="form-control filter-select">
                <option value="">All Statuses</option>
                <option value="draft">Draft</option>
                <option value="active">Active</option>
                <option value="expired">Expired</option>
                <option value="superseded">Superseded</option>
              </select>
            </div>
          </div>

          <div class="noa-list" id="noaList">
            <div class="skeleton-card"><div class="skeleton-line long"></div><div class="skeleton-line medium"></div></div>
          </div>
        </div>

        <!-- Utility Locates Section -->
        <div id="section-locates" class="section" style="display: none;">
          <div class="table-toolbar">
            <div class="filter-controls">
              <select id="locateStatusFilter" class="form-control filter-select">
                <option value="">All Statuses</option>
                <option value="pending">Pending</option>
                <option value="partial">Partial</option>
                <option value="complete">Complete</option>
                <option value="expired">Expired</option>
              </select>
            </div>
          </div>

          <div class="locate-list" id="locateList">
            <div class="skeleton-card"><div class="skeleton-line long"></div><div class="skeleton-line medium"></div></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Create Modal -->
  <div id="createModal" class="modal">
    <div class="modal-content modal-md">
      <div class="modal-header">
        <h2 id="modalTitle">New Entry</h2>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <!-- Entry Type Selector -->
        <div class="form-group">
          <label>Entry Type</label>
          <div class="btn-group">
            <button type="button" class="btn btn-secondary active" id="btnNoa" onclick="setEntryType('noa')">NOA</button>
            <button type="button" class="btn btn-secondary" id="btnLocate" onclick="setEntryType('locate')">Utility Locate</button>
          </div>
        </div>

        <!-- NOA Form -->
        <form id="noaForm">
          <input type="hidden" id="noaId">

          <div class="form-row">
            <div class="form-group">
              <label for="noaNumber">NOA Number</label>
              <input type="text" id="noaNumber" class="form-control" placeholder="NOA-2024-001">
            </div>
            <div class="form-group">
              <label for="noaType">Type *</label>
              <select id="noaType" class="form-control" required>
                <option value="commencement">Commencement</option>
                <option value="completion">Completion</option>
                <option value="abandonment">Abandonment</option>
                <option value="violation">Violation</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="noaJob">Job *</label>
            <select id="noaJob" class="form-control" required>
              <option value="">Select job...</option>
            </select>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="noaIssueDate">Issue Date</label>
              <input type="date" id="noaIssueDate" class="form-control">
            </div>
            <div class="form-group">
              <label for="noaEffectiveDate">Effective Date</label>
              <input type="date" id="noaEffectiveDate" class="form-control">
            </div>
          </div>

          <div class="form-group">
            <label for="noaExpirationDate">Expiration Date</label>
            <input type="date" id="noaExpirationDate" class="form-control">
          </div>

          <div class="form-group">
            <label for="noaNotes">Notes</label>
            <textarea id="noaNotes" class="form-control" rows="3"></textarea>
          </div>
        </form>

        <!-- Utility Locate Form -->
        <form id="locateForm" style="display: none;">
          <input type="hidden" id="locateId">

          <div class="form-row">
            <div class="form-group">
              <label for="locateTicketNumber">Ticket Number *</label>
              <input type="text" id="locateTicketNumber" class="form-control" required placeholder="811-12345678">
            </div>
            <div class="form-group">
              <label for="locateCallCenter">Call Center</label>
              <input type="text" id="locateCallCenter" class="form-control" value="811" placeholder="811">
            </div>
          </div>

          <div class="form-group">
            <label for="locateJob">Job *</label>
            <select id="locateJob" class="form-control" required>
              <option value="">Select job...</option>
            </select>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="locateRequestDate">Request Date *</label>
              <input type="date" id="locateRequestDate" class="form-control" required>
            </div>
            <div class="form-group">
              <label for="locateValidUntil">Valid Until</label>
              <input type="date" id="locateValidUntil" class="form-control">
            </div>
          </div>

          <div class="form-group">
            <label for="locateAddress">Work Address</label>
            <input type="text" id="locateAddress" class="form-control" placeholder="Address of work">
          </div>

          <div class="form-group">
            <label for="locateWorkArea">Work Area</label>
            <input type="text" id="locateWorkArea" class="form-control" placeholder="Description of work area">
          </div>

          <div class="form-group">
            <label>Utilities Requested</label>
            <div class="checkbox-group">
              <label><input type="checkbox" name="utility" value="electric"> Electric</label>
              <label><input type="checkbox" name="utility" value="gas"> Gas</label>
              <label><input type="checkbox" name="utility" value="water"> Water</label>
              <label><input type="checkbox" name="utility" value="sewer"> Sewer</label>
              <label><input type="checkbox" name="utility" value="telecom"> Telecom</label>
              <label><input type="checkbox" name="utility" value="cable"> Cable</label>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="locateWorkType">Work Type</label>
              <select id="locateWorkType" class="form-control">
                <option value="">Select...</option>
                <option value="excavation">Excavation</option>
                <option value="boring">Boring</option>
                <option value="drilling">Drilling</option>
                <option value="trenching">Trenching</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="form-group">
              <label for="locateDepth">Depth (inches)</label>
              <input type="number" id="locateDepth" class="form-control" min="1">
            </div>
          </div>

          <div class="form-group">
            <label for="locateNotes">Notes</label>
            <textarea id="locateNotes" class="form-control" rows="2"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="saveEntry()">Save</button>
      </div>
    </div>
  </div>

  <!-- NOA Detail Modal -->
  <div id="noaDetailModal" class="modal modal-fullscreen-dark">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title-row">
          <h2 id="noaDetailTitle">NOA Details</h2>
          <div class="modal-badges" id="noaDetailBadges"></div>
        </div>
        <button class="close-btn" onclick="closeNoaDetailModal()">&times;</button>
      </div>
      <div class="modal-body" id="noaDetailBody"></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="editNoa()">Edit</button>
        <button class="btn btn-danger" onclick="deleteNoa()">Delete</button>
      </div>
    </div>
  </div>

  <!-- Locate Detail Modal -->
  <div id="locateDetailModal" class="modal modal-fullscreen-dark">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title-row">
          <h2 id="locateDetailTitle">Utility Locate Details</h2>
          <div class="modal-badges" id="locateDetailBadges"></div>
        </div>
        <button class="close-btn" onclick="closeLocateDetailModal()">&times;</button>
      </div>
      <div class="modal-body" id="locateDetailBody"></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="markUtility()">Mark Utility</button>
        <button class="btn btn-secondary" onclick="editLocate()">Edit</button>
        <button class="btn btn-danger" onclick="deleteLocate()">Delete</button>
      </div>
    </div>
  </div>

  <!-- Mark Utility Modal -->
  <div id="markUtilityModal" class="modal">
    <div class="modal-content modal-sm">
      <div class="modal-header">
        <h2>Mark Utility Located</h2>
        <button class="close-btn" onclick="closeMarkUtilityModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="markUtilityForm">
          <div class="form-group">
            <label for="markUtility">Utility</label>
            <select id="markUtility" class="form-control" required>
              <option value="">Select utility...</option>
            </select>
          </div>
          <div class="form-group">
            <label for="markedBy">Marked By</label>
            <input type="text" id="markedBy" class="form-control" placeholder="Person or company">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeMarkUtilityModal()">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="saveMarkUtility()">Mark as Located</button>
      </div>
    </div>
  </div>

  <!-- Calendar Modal -->
  <div id="calendarModal" class="modal modal-fullscreen-dark">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Compliance Calendar</h2>
        <button class="close-btn" onclick="closeCalendarModal()">&times;</button>
      </div>
      <div class="modal-body" id="calendarBody">
        <div class="calendar-container" id="calendarContainer"></div>
      </div>
    </div>
  </div>

  <script src="js/nav-sidebar.js"></script>
  <script src="js/toasts.js"></script>
  <script src="js/compliance.js"></script>
</body>
</html>
