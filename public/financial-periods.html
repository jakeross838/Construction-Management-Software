<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fnfkowpdlffzjqtmbnmj.supabase.co">
  <link rel="dns-prefetch" href="https://fnfkowpdlffzjqtmbnmj.supabase.co">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏗️</text></svg>">
  <title>Ross Built - Financial Periods</title>
  <link rel="stylesheet" href="css/styles.css?v=20260120">
</head>
<body data-page-context="company" data-page-id="financial-periods" data-page-group="company-finance" data-role-min="admin">
  <div class="app">
    <header class="header">
      <div class="header-top">
        <div class="header-brand">
          <span class="brand-icon">🏗️</span>
          <span class="brand-name">Ross Built</span>
        </div>
        <nav class="main-nav"></nav>
        <div class="header-actions">
          <button class="btn btn-primary" onclick="openCreateModal()">+ New Period</button>
        </div>
      </div>
      <div class="header-sub">
        <nav class="sub-nav"></nav>
      </div>
    </header>

    <div class="app-body">
      <main class="main">
        <!-- Stats Summary Bar -->
        <div class="stats-bar">
          <div class="stat-item">
            <span class="stat-value" id="statTotal">0</span>
            <span class="stat-label">Total Periods</span>
          </div>
          <div class="stat-item">
            <span class="stat-value stat-passed" id="statOpen">0</span>
            <span class="stat-label">Open</span>
          </div>
          <div class="stat-item">
            <span class="stat-value stat-info" id="statClosed">0</span>
            <span class="stat-label">Closed</span>
          </div>
          <div class="stat-item">
            <span class="stat-value" id="statTotalExpenses">$0</span>
            <span class="stat-label">Total Expenses</span>
          </div>
        </div>

        <!-- Filters -->
        <div class="table-toolbar">
          <div class="filter-controls">
            <select id="statusFilter" class="form-control filter-select">
              <option value="">All Status</option>
              <option value="open">Open</option>
              <option value="closed">Closed</option>
            </select>
            <select id="yearFilter" class="form-control filter-select">
              <option value="">All Years</option>
              <option value="2026">2026</option>
              <option value="2025">2025</option>
            </select>
          </div>
          <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search periods..." class="form-control search-input">
            <button class="search-clear-btn" id="searchClear" style="display: none;" onclick="clearSearch()">&times;</button>
          </div>
        </div>

        <!-- Period List -->
        <div class="period-list" id="periodList">
          <div class="skeleton-card"><div class="skeleton-line long"></div><div class="skeleton-line medium"></div></div>
          <div class="skeleton-card"><div class="skeleton-line long"></div><div class="skeleton-line medium"></div></div>
          <div class="skeleton-card"><div class="skeleton-line long"></div><div class="skeleton-line medium"></div></div>
        </div>
      </main>
    </div>
  </div>

  <!-- Create/Edit Period Modal -->
  <div id="periodModal" class="modal">
    <div class="modal-content modal-md">
      <div class="modal-header">
        <h2 id="modalTitle">Create Financial Period</h2>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="periodForm">
          <input type="hidden" id="periodId">

          <div class="form-group">
            <label for="periodName">Period Name *</label>
            <input type="text" id="periodName" class="form-control" required placeholder="e.g., January 2026">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="periodType">Period Type</label>
              <select id="periodType" class="form-control">
                <option value="monthly">Monthly</option>
                <option value="quarterly">Quarterly</option>
                <option value="annual">Annual</option>
                <option value="custom">Custom</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="startDate">Start Date *</label>
              <input type="date" id="startDate" class="form-control" required>
            </div>
            <div class="form-group">
              <label for="endDate">End Date *</label>
              <input type="date" id="endDate" class="form-control" required>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="savePeriod()">Save Period</button>
      </div>
    </div>
  </div>

  <!-- Period Detail Modal -->
  <div id="detailModal" class="modal modal-fullscreen-dark">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title-row">
          <h2 id="detailTitle">Period Details</h2>
          <div class="modal-badges" id="detailBadges"></div>
        </div>
        <button class="close-btn" onclick="closeDetailModal()">&times;</button>
      </div>
      <div class="modal-body" id="detailBody">
        <!-- Filled dynamically -->
      </div>
      <div class="modal-footer" id="detailFooter">
        <!-- Action buttons -->
      </div>
    </div>
  </div>

  <script src="js/nav-sidebar.js"></script>
  <script src="js/toasts.js"></script>
  <script src="js/financial-periods.js"></script>
</body>
</html>
