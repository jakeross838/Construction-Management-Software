<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications | Ross Built CMS</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-top">
        <div class="header-brand">
          <span class="brand-icon">🏗️</span>
          <span class="brand-name">Ross Built</span>
        </div>
        <nav class="main-nav"></nav>
        <div class="header-actions">
          <button class="btn btn-secondary" onclick="openPreferencesModal()">Preferences</button>
        </div>
      </div>
      <div class="header-sub">
        <nav class="sub-nav"></nav>
      </div>
    </header>

    <div class="app-body">
      <main class="main">
        <!-- Page Header -->
        <div class="page-header">
          <div class="page-header-left">
            <h2 class="page-title">Notifications</h2>
            <span class="unread-count" id="unreadCount" style="display: none;">0 unread</span>
          </div>
          <div class="page-header-right">
            <button class="btn btn-secondary" onclick="markAllRead()">Mark All Read</button>
            <button class="btn btn-danger" onclick="clearAllNotifications()">Clear All</button>
          </div>
        </div>

        <!-- Filters -->
        <div class="table-toolbar">
          <div class="toolbar-left">
            <select id="readFilter" class="form-select">
              <option value="">All Notifications</option>
              <option value="false">Unread</option>
              <option value="true">Read</option>
            </select>
            <select id="typeFilter" class="form-select">
              <option value="">All Types</option>
              <option value="info">Info</option>
              <option value="success">Success</option>
              <option value="warning">Warning</option>
              <option value="error">Error</option>
              <option value="task">Task</option>
              <option value="rfi">RFI</option>
              <option value="submittal">Submittal</option>
              <option value="invoice">Invoice</option>
              <option value="po">Purchase Order</option>
            </select>
          </div>
          <div class="toolbar-right">
            <input type="search" id="searchInput" class="form-input" placeholder="Search notifications...">
          </div>
        </div>

        <!-- Notifications List -->
        <div class="notifications-list" id="notificationsList">
          <div class="loading-state">Loading notifications...</div>
        </div>

        <!-- Empty State -->
        <div class="empty-state" id="emptyState" style="display: none;">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <h3>No Notifications</h3>
          <p>You're all caught up! No notifications to display.</p>
        </div>
      </main>
    </div>
  </div>

  <!-- Preferences Modal -->
  <div id="preferencesModal" class="modal modal-centered">
    <div class="modal-content modal-medium">
      <div class="modal-header">
        <h3>Notification Preferences</h3>
        <button class="modal-close" onclick="closePreferencesModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="preferencesForm">
          <div class="form-section">
            <h4>Email Notifications</h4>
            <div class="form-group">
              <label class="checkbox-label">
                <input type="checkbox" id="prefEmailEnabled">
                Enable email notifications
              </label>
            </div>
            <div class="form-group">
              <label for="prefEmailFrequency">Email Frequency</label>
              <select id="prefEmailFrequency" class="form-select">
                <option value="instant">Instant</option>
                <option value="hourly">Hourly Digest</option>
                <option value="daily">Daily Digest</option>
                <option value="weekly">Weekly Digest</option>
              </select>
            </div>
          </div>

          <div class="form-section">
            <h4>In-App Notifications</h4>
            <div class="form-group">
              <label class="checkbox-label">
                <input type="checkbox" id="prefInAppEnabled">
                Enable in-app notifications
              </label>
            </div>
          </div>

          <div class="form-section">
            <h4>Notification Types</h4>
            <div class="checkbox-group">
              <label class="checkbox-label">
                <input type="checkbox" id="prefTaskAssigned">
                Task assigned to me
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="prefTaskDue">
                Task due reminders
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="prefRfiReceived">
                RFI received
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="prefRfiResponse">
                RFI response received
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="prefSubmittalReview">
                Submittal needs review
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="prefInvoiceApproved">
                Invoice approved
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="prefPoApproved">
                PO approved
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="prefMention">
                Mentions
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="prefMessage">
                New messages
              </label>
            </div>
          </div>

          <div class="form-section">
            <h4>Quiet Hours</h4>
            <div class="form-row">
              <div class="form-group">
                <label for="prefQuietStart">Start Time</label>
                <input type="time" id="prefQuietStart" class="form-input">
              </div>
              <div class="form-group">
                <label for="prefQuietEnd">End Time</label>
                <input type="time" id="prefQuietEnd" class="form-input">
              </div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closePreferencesModal()">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="savePreferences()">Save Preferences</button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <script src="js/toasts.js"></script>
  <script defer src="js/nav-sidebar.js"></script>
  <script defer src="js/sidebar.js"></script>
  <script src="js/notifications.js"></script>
</body>
</html>
