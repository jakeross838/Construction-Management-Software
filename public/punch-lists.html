<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fnfkowpdlffzjqtmbnmj.supabase.co">
  <link rel="dns-prefetch" href="https://fnfkowpdlffzjqtmbnmj.supabase.co">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏗️</text></svg>">
  <title>Ross Built - Punch Lists</title>
  <link rel="stylesheet" href="css/styles.css?v=20260118c-tabs">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-top">
        <div class="header-brand">
          <span class="brand-icon">🏗️</span>
          <span class="brand-name">Ross Built</span>
        </div>
        <nav class="main-nav"></nav>
        <div class="header-actions">
          <button class="btn btn-primary" onclick="openCreateModal()">+ New Punch List</button>
        </div>
      </div>
      <div class="header-sub">
        <nav class="sub-nav"></nav>
      </div>
    </header>

    <div class="app-body">
      <main class="main">
        <!-- Stats Summary Bar -->
        <div class="inspection-stats-bar">
          <div class="stat-item">
            <span class="stat-icon">📋</span>
            <span class="stat-value" id="statTotal">0</span>
            <span class="stat-label">Total Lists</span>
          </div>
          <div class="stat-item">
            <span class="stat-icon">🔴</span>
            <span class="stat-value stat-failed" id="statOpen">0</span>
            <span class="stat-label">Open</span>
          </div>
          <div class="stat-item">
            <span class="stat-icon">🟡</span>
            <span class="stat-value stat-upcoming" id="statInProgress">0</span>
            <span class="stat-label">In Progress</span>
          </div>
          <div class="stat-item">
            <span class="stat-icon">✅</span>
            <span class="stat-value stat-passed" id="statResolved">0</span>
            <span class="stat-label">Resolved</span>
          </div>
          <div class="stat-item">
            <span class="stat-icon">🔒</span>
            <span class="stat-value" id="statClosed">0</span>
            <span class="stat-label">Closed</span>
          </div>
        </div>

        <!-- Filters -->
        <div class="table-toolbar">
          <div class="filter-controls">
            <select id="jobFilter" class="form-control filter-select">
              <option value="">All Jobs</option>
            </select>
            <select id="statusFilter" class="form-control filter-select">
              <option value="">All Status</option>
              <option value="open">Open</option>
              <option value="in_progress">In Progress</option>
              <option value="resolved">Resolved</option>
              <option value="closed">Closed</option>
            </select>
            <select id="vendorFilter" class="form-control filter-select">
              <option value="">All Vendors</option>
            </select>
          </div>
          <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search punch lists..." class="form-control search-input">
            <button class="search-clear-btn" id="searchClear" style="display: none;" onclick="clearSearch()">&times;</button>
          </div>
        </div>

        <!-- Punch List Grid -->
        <div class="inspection-list" id="punchListGrid">
          <div class="skeleton-card"><div class="skeleton-line long"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div>
          <div class="skeleton-card"><div class="skeleton-line long"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div>
          <div class="skeleton-card"><div class="skeleton-line long"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div>
        </div>
      </main>
    </div>
  </div>

  <!-- Create/Edit Punch List Modal -->
  <div id="createModal" class="modal">
    <div class="modal-content modal-md">
      <div class="modal-header">
        <h2 id="createModalTitle">New Punch List</h2>
        <button class="close-btn" onclick="closeCreateModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="createForm">
          <input type="hidden" id="editingId">

          <div class="form-group">
            <label for="formJob">Job *</label>
            <select id="formJob" class="form-control" required>
              <option value="">Select Job...</option>
            </select>
          </div>

          <div class="form-group">
            <label for="formTitle">Title *</label>
            <input type="text" id="formTitle" class="form-control" required placeholder="e.g., Final Walkthrough Items">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="formPO">Purchase Order (optional)</label>
              <select id="formPO" class="form-control">
                <option value="">No PO link</option>
              </select>
            </div>
            <div class="form-group">
              <label for="formVendor">Assigned Vendor</label>
              <select id="formVendor" class="form-control">
                <option value="">No vendor assigned</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="formDueDate">Due Date</label>
            <input type="date" id="formDueDate" class="form-control">
          </div>

          <div class="form-group">
            <label for="formDescription">Description</label>
            <textarea id="formDescription" class="form-control" rows="3" placeholder="Description of work needed..."></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeCreateModal()">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="savePunchList()">Create Punch List</button>
      </div>
    </div>
  </div>

  <!-- Punch List Detail Modal -->
  <div id="detailModal" class="modal modal-fullscreen-dark">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title-group">
          <h2 id="detailTitle">Punch List</h2>
          <span class="status-badge" id="detailStatus"></span>
        </div>
        <button class="close-btn" onclick="closeDetailModal()">&times;</button>
      </div>
      <div class="modal-body" id="detailBody">
        <div class="loading">Loading...</div>
      </div>
      <div class="modal-footer" id="detailFooter">
      </div>
    </div>
  </div>

  <!-- Add Item Modal -->
  <div id="addItemModal" class="modal">
    <div class="modal-content modal-sm">
      <div class="modal-header">
        <h2 id="addItemTitle">Add Item</h2>
        <button class="close-btn" onclick="closeAddItemModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="addItemForm">
          <input type="hidden" id="itemPunchListId">
          <input type="hidden" id="editingItemId">

          <div class="form-group">
            <label for="itemDescription">Description *</label>
            <textarea id="itemDescription" class="form-control" rows="2" required placeholder="Describe the deficiency..."></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="itemLocation">Location</label>
              <input type="text" id="itemLocation" class="form-control" placeholder="e.g., Master Bath">
            </div>
            <div class="form-group">
              <label for="itemCategory">Category</label>
              <select id="itemCategory" class="form-control">
                <option value="">Select...</option>
                <option value="finish">Finish</option>
                <option value="structural">Structural</option>
                <option value="mechanical">Mechanical</option>
                <option value="electrical">Electrical</option>
                <option value="plumbing">Plumbing</option>
                <option value="other">Other</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="itemPriority">Priority</label>
              <select id="itemPriority" class="form-control">
                <option value="low">Low</option>
                <option value="normal" selected>Normal</option>
                <option value="high">High</option>
                <option value="critical">Critical</option>
              </select>
            </div>
            <div class="form-group">
              <label for="itemVendor">Assigned Vendor</label>
              <select id="itemVendor" class="form-control">
                <option value="">No vendor assigned</option>
              </select>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeAddItemModal()">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="saveItem()">Add Item</button>
      </div>
    </div>
  </div>

  <!-- Photo Upload Modal -->
  <div id="photoModal" class="modal">
    <div class="modal-content modal-sm">
      <div class="modal-header">
        <h2>Upload Photo</h2>
        <button class="close-btn" onclick="closePhotoModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="photoForm">
          <input type="hidden" id="photoPunchListId">
          <input type="hidden" id="photoItemId">

          <div class="form-group">
            <label for="photoFile">Photo *</label>
            <input type="file" id="photoFile" class="form-control" accept="image/*" required>
          </div>

          <div class="form-group">
            <label for="photoCategory">Category</label>
            <select id="photoCategory" class="form-control">
              <option value="before">Before (Issue)</option>
              <option value="progress">Progress</option>
              <option value="after">After (Fixed)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="photoCaption">Caption</label>
            <input type="text" id="photoCaption" class="form-control" placeholder="Brief description...">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closePhotoModal()">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="uploadPhoto()">Upload</button>
      </div>
    </div>
  </div>

  <!-- Resolution Modal -->
  <div id="resolveModal" class="modal">
    <div class="modal-content modal-sm">
      <div class="modal-header">
        <h2>Mark as Resolved</h2>
        <button class="close-btn" onclick="closeResolveModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="resolveForm">
          <input type="hidden" id="resolveItemId">

          <div class="form-group">
            <label for="resolutionNotes">Resolution Notes</label>
            <textarea id="resolutionNotes" class="form-control" rows="3" placeholder="Describe what was done to fix the issue..."></textarea>
          </div>

          <p class="form-hint">This will mark the item as resolved. A PM must verify the fix.</p>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeResolveModal()">Cancel</button>
        <button type="button" class="btn btn-success" onclick="confirmResolve()">Mark Resolved</button>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script defer src="js/api-cache.js?v=20260118fix"></script>
  <script defer src="js/toasts.js?v=20260118fix"></script>
  <script defer src="js/nav-sidebar.js?v=20260118fix"></script>
  <script defer src="js/realtime.js?v=20260118fix"></script>
  <script defer src="js/punch-lists.js?v=20260118fix"></script>
</body>
</html>
