<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fnfkowpdlffzjqtmbnmj.supabase.co">
  <link rel="dns-prefetch" href="https://fnfkowpdlffzjqtmbnmj.supabase.co">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128230;</text></svg>">
  <title>Ross Built - Assembly Library</title>
  <link rel="stylesheet" href="css/styles.css?v=20260122-assembly">
  <style>
    .assembly-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding: 1rem 1.5rem;
      background: var(--bg-card);
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .assembly-header h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 600;
    }
    .filter-bar {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding: 1rem 1.5rem;
      background: var(--bg-card);
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .filter-bar select,
    .filter-bar input {
      flex: 1;
      max-width: 250px;
    }
    .templates-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }
    .template-card {
      background: var(--bg-card);
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s;
    }
    .template-card:hover {
      border-color: var(--accent-blue);
      transform: translateY(-2px);
    }
    .template-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 1rem 1.25rem;
      background: var(--bg-card-elevated);
      border-bottom: 1px solid var(--border);
    }
    .template-card-header h4 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
    }
    .template-card-body {
      padding: 1rem 1.25rem;
    }
    .template-card-body p {
      margin: 0 0 0.75rem;
      color: var(--text-secondary);
      font-size: 0.875rem;
    }
    .template-meta {
      display: flex;
      gap: 1.5rem;
      color: var(--text-secondary);
      font-size: 0.85rem;
    }
    .template-meta strong {
      color: var(--text-primary);
    }
    .template-card-footer {
      padding: 0.75rem 1.25rem;
      border-top: 1px solid var(--border);
      background: var(--bg-card-elevated);
    }
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-secondary);
    }
    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 1rem;
      opacity: 0.5;
    }
    .empty-state h3 {
      margin: 0 0 0.5rem;
      color: var(--text-primary);
    }
    /* Template Editor Modal */
    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      background: var(--bg-card-elevated);
      border-bottom: 1px solid var(--border);
    }
    .editor-header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex: 1;
    }
    .editor-header-left input {
      font-size: 1.25rem;
      font-weight: 600;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 0.5rem;
      color: var(--text-primary);
      width: 300px;
    }
    .editor-header-left input:focus {
      border-color: var(--accent-blue);
      outline: none;
    }
    .editor-body {
      padding: 1.5rem;
      overflow-y: auto;
      max-height: calc(100vh - 160px);
    }
    .editor-section {
      margin-bottom: 1.5rem;
    }
    .editor-section-title {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 0.75rem;
    }
    .editor-row {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    /* Items Table */
    .items-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.75rem;
    }
    .items-table th {
      text-align: left;
      padding: 0.75rem;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-secondary);
      background: var(--bg-card-elevated);
      border-bottom: 1px solid var(--border);
    }
    .items-table td {
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .items-table tr:hover {
      background: var(--bg-card-elevated);
    }
    .items-table input,
    .items-table select {
      width: 100%;
      padding: 0.375rem 0.5rem;
      font-size: 0.875rem;
    }
    .items-table .col-num { width: 40px; text-align: center; }
    .items-table .col-code { width: 150px; }
    .items-table .col-desc { width: auto; }
    .items-table .col-qty { width: 80px; }
    .items-table .col-unit { width: 80px; }
    .items-table .col-cost { width: 100px; }
    .items-table .col-total { width: 100px; text-align: right; }
    .items-table .col-actions { width: 50px; text-align: center; }
    .add-item-row {
      cursor: pointer;
      color: var(--accent-blue);
    }
    .add-item-row:hover {
      background: var(--bg-card-elevated);
    }
    .add-item-row td {
      padding: 0.75rem;
    }
    .items-footer {
      display: flex;
      justify-content: flex-end;
      padding: 1rem 0;
      border-top: 2px solid var(--border);
      margin-top: 1rem;
    }
    .items-total {
      font-size: 1.125rem;
      font-weight: 600;
    }
    .items-total span {
      color: var(--accent-green);
      margin-left: 0.5rem;
    }
    /* Editor Footer */
    .editor-footer {
      display: flex;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      background: var(--bg-card-elevated);
      border-top: 1px solid var(--border);
    }
    .editor-footer-left {
      display: flex;
      gap: 0.75rem;
    }
    .editor-footer-right {
      display: flex;
      gap: 0.75rem;
    }
    /* Toggle Switch */
    .toggle-switch {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .toggle-switch input[type="checkbox"] {
      width: 40px;
      height: 22px;
      appearance: none;
      background: var(--border);
      border-radius: 11px;
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle-switch input[type="checkbox"]:checked {
      background: var(--accent-green);
    }
    .toggle-switch input[type="checkbox"]::before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      background: white;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: transform 0.2s;
    }
    .toggle-switch input[type="checkbox"]:checked::before {
      transform: translateX(18px);
    }
  </style>
</head>
<body data-page-context="company" data-page-id="assembly-library" data-page-group="resources" data-role-min="admin">
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-top">
        <div class="header-brand">
          <span class="brand-icon">&#128230;</span>
          <span class="brand-name">Ross Built</span>
        </div>
        <nav class="main-nav">
          <!-- Filled by nav-sidebar.js -->
        </nav>
        <div class="header-actions">
          <button class="btn btn-primary" onclick="createTemplate()">+ Create Template</button>
        </div>
      </div>
      <div class="header-sub">
        <nav class="sub-nav">
          <!-- Filled by nav-sidebar.js -->
        </nav>
      </div>
    </header>

    <!-- Main Content -->
    <div class="app-body">
      <main class="main">
        <!-- Page Header -->
        <div class="assembly-header">
          <div>
            <h1>Assembly Library</h1>
            <p class="text-secondary" style="margin: 0.25rem 0 0;">Manage reusable assembly templates for estimates</p>
          </div>
          <div id="statsDisplay" class="text-secondary">
            <span id="templateCount">0 templates</span>
          </div>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar">
          <select id="categoryFilter" class="form-control" onchange="loadTemplates()">
            <option value="">All Categories</option>
          </select>
          <input type="text" id="searchInput" class="form-control" placeholder="Search templates..." oninput="handleSearch()">
          <label class="toggle-switch" style="margin-left: auto;">
            <input type="checkbox" id="showInactive" onchange="loadTemplates()">
            <span class="text-secondary">Show Inactive</span>
          </label>
        </div>

        <!-- Templates Grid -->
        <div id="templatesGrid" class="templates-grid">
          <div class="loading">Loading templates...</div>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state" style="display: none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="3" y1="9" x2="21" y2="9"></line>
            <line x1="9" y1="21" x2="9" y2="9"></line>
          </svg>
          <h3>No Assembly Templates</h3>
          <p>Create your first template to get started</p>
          <button class="btn btn-primary" style="margin-top: 1rem;" onclick="createTemplate()">+ Create Template</button>
        </div>
      </main>
    </div>
  </div>

  <!-- Template Editor Modal -->
  <div id="templateEditorModal" class="modal modal-fullscreen-dark">
    <div class="modal-content">
      <div class="editor-header">
        <div class="editor-header-left">
          <input type="text" id="templateName" placeholder="Template Name" value="">
          <label class="toggle-switch">
            <input type="checkbox" id="templateActive" checked>
            <span>Active</span>
          </label>
        </div>
        <button class="btn btn-secondary" onclick="closeTemplateEditor()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="editor-body">
        <!-- Template Details -->
        <div class="editor-section">
          <div class="editor-section-title">Template Details</div>
          <div class="editor-row">
            <div class="form-group">
              <label>Category</label>
              <input type="text" id="templateCategory" class="form-control" placeholder="e.g., Bathrooms, Kitchens">
            </div>
            <div class="form-group">
              <label>Description</label>
              <textarea id="templateDescription" class="form-control" rows="2" placeholder="Template description..."></textarea>
            </div>
          </div>
        </div>

        <!-- Line Items -->
        <div class="editor-section">
          <div class="editor-section-title">Line Items</div>
          <table class="items-table">
            <thead>
              <tr>
                <th class="col-num">#</th>
                <th class="col-code">Cost Code</th>
                <th class="col-desc">Description</th>
                <th class="col-qty">Qty</th>
                <th class="col-unit">Unit</th>
                <th class="col-cost">Unit Cost</th>
                <th class="col-total">Total</th>
                <th class="col-actions"></th>
              </tr>
            </thead>
            <tbody id="itemsTableBody">
              <!-- Items rendered here -->
            </tbody>
            <tfoot>
              <tr class="add-item-row" onclick="addTemplateItem()">
                <td colspan="8">
                  <span style="display: flex; align-items: center; gap: 0.5rem;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <line x1="12" y1="5" x2="12" y2="19"></line>
                      <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Add Item
                  </span>
                </td>
              </tr>
            </tfoot>
          </table>
          <div class="items-footer">
            <div class="items-total">
              Template Total: <span id="templateTotal">$0.00</span>
            </div>
          </div>
        </div>
      </div>
      <div class="editor-footer">
        <div class="editor-footer-left">
          <button class="btn btn-danger" onclick="deleteTemplate()">Deactivate</button>
        </div>
        <div class="editor-footer-right">
          <button class="btn btn-secondary" onclick="closeTemplateEditor()">Cancel</button>
          <button class="btn btn-primary" onclick="saveTemplate()">Save Template</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/toasts.js"></script>
  <script src="js/nav-sidebar.js"></script>
  <script src="js/assembly-library.js"></script>
</body>
</html>
