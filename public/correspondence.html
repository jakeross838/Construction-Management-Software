<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fnfkowpdlffzjqtmbnmj.supabase.co">
  <link rel="dns-prefetch" href="https://fnfkowpdlffzjqtmbnmj.supabase.co">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏗️</text></svg>">
  <title>Ross Built - Correspondence</title>
  <link rel="stylesheet" href="css/styles.css?v=20260121">
</head>
<body data-page-context="job" data-page-id="correspondence" data-page-group="active" data-role-min="pm">
  <div class="app">
    <header class="header">
      <div class="header-top">
        <div class="header-brand">
          <span class="brand-icon">🏗️</span>
          <span class="brand-name">Ross Built</span>
        </div>
        <nav class="main-nav"></nav>
        <div class="header-actions">
          <button class="btn btn-secondary" onclick="refreshList()">Refresh</button>
          <button class="btn btn-primary" onclick="openCreateModal()">+ New Entry</button>
        </div>
      </div>
      <div class="header-sub">
        <nav class="sub-nav"></nav>
      </div>
    </header>

    <div class="app-body">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <h3>Jobs</h3>
        </div>
        <div class="sidebar-search">
          <input type="text" id="jobSearch" placeholder="Search jobs..." class="form-control">
        </div>
        <ul class="sidebar-list" id="jobList">
          <li class="sidebar-item active" data-job-id="">
            <span class="sidebar-item-name">All Jobs</span>
          </li>
        </ul>
      </aside>

      <main class="main">
        <!-- Stats Summary Bar -->
        <div class="stats-bar">
          <div class="stat-item">
            <span class="stat-value" id="statTotal">0</span>
            <span class="stat-label">Total</span>
          </div>
          <div class="stat-item">
            <span class="stat-value stat-warning" id="statUnread">0</span>
            <span class="stat-label">Unread</span>
          </div>
          <div class="stat-item">
            <span class="stat-value stat-starred" id="statStarred">0</span>
            <span class="stat-label">Starred</span>
          </div>
          <div class="stat-item">
            <span class="stat-value stat-urgent" id="statUrgent">0</span>
            <span class="stat-label">Urgent</span>
          </div>
        </div>

        <!-- Filters -->
        <div class="table-toolbar">
          <div class="filter-controls">
            <select id="typeFilter" class="form-control filter-select">
              <option value="">All Types</option>
              <option value="general">General</option>
              <option value="inquiry">Inquiry</option>
              <option value="quote_request">Quote Request</option>
              <option value="approval">Approval</option>
              <option value="notification">Notification</option>
            </select>
            <select id="priorityFilter" class="form-control filter-select">
              <option value="">All Priorities</option>
              <option value="low">Low</option>
              <option value="normal">Normal</option>
              <option value="high">High</option>
              <option value="urgent">Urgent</option>
            </select>
            <select id="vendorFilter" class="form-control filter-select">
              <option value="">All Contacts</option>
            </select>
            <label class="checkbox-filter">
              <input type="checkbox" id="unreadFilter"> Unread Only
            </label>
            <label class="checkbox-filter">
              <input type="checkbox" id="starredFilter"> Starred
            </label>
          </div>
          <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search correspondence..." class="form-control search-input">
            <button class="search-clear-btn" id="searchClear" style="display: none;" onclick="clearSearch()">&times;</button>
          </div>
        </div>

        <!-- Correspondence List -->
        <div class="correspondence-list" id="correspondenceList">
          <div class="skeleton-card"><div class="skeleton-line long"></div><div class="skeleton-line medium"></div></div>
          <div class="skeleton-card"><div class="skeleton-line long"></div><div class="skeleton-line medium"></div></div>
          <div class="skeleton-card"><div class="skeleton-line long"></div><div class="skeleton-line medium"></div></div>
        </div>
      </main>
    </div>
  </div>

  <!-- Create/Edit Modal -->
  <div id="createModal" class="modal">
    <div class="modal-content modal-md">
      <div class="modal-header">
        <h2 id="modalTitle">Log Correspondence</h2>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="correspondenceForm">
          <input type="hidden" id="correspondenceId">

          <div class="form-group">
            <label for="subject">Subject *</label>
            <input type="text" id="subject" class="form-control" required placeholder="Subject line">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="fromAddress">From *</label>
              <input type="email" id="fromAddress" class="form-control" required placeholder="email@example.com">
            </div>
            <div class="form-group">
              <label for="fromName">Name</label>
              <input type="text" id="fromName" class="form-control" placeholder="Sender name">
            </div>
          </div>

          <div class="form-group">
            <label for="toAddresses">To</label>
            <input type="text" id="toAddresses" class="form-control" placeholder="recipient@example.com (comma separated)">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="sentDate">Date</label>
              <input type="datetime-local" id="sentDate" class="form-control">
            </div>
            <div class="form-group">
              <label for="correspondenceType">Type</label>
              <select id="correspondenceType" class="form-control">
                <option value="general">General</option>
                <option value="inquiry">Inquiry</option>
                <option value="quote_request">Quote Request</option>
                <option value="approval">Approval</option>
                <option value="notification">Notification</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="jobSelect">Job</label>
              <select id="jobSelect" class="form-control">
                <option value="">No job linked</option>
              </select>
            </div>
            <div class="form-group">
              <label for="priority">Priority</label>
              <select id="priority" class="form-control">
                <option value="low">Low</option>
                <option value="normal" selected>Normal</option>
                <option value="high">High</option>
                <option value="urgent">Urgent</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="bodyText">Content</label>
            <textarea id="bodyText" class="form-control" rows="6" placeholder="Email body or summary..."></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="saveCorrespondence()">Save</button>
      </div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div id="detailModal" class="modal modal-fullscreen-dark">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title-row">
          <h2 id="detailSubject">Correspondence Details</h2>
          <div class="modal-badges" id="detailBadges"></div>
        </div>
        <button class="close-btn" onclick="closeDetailModal()">&times;</button>
      </div>
      <div class="modal-body" id="detailBody">
        <!-- Filled dynamically -->
      </div>
      <div class="modal-footer" id="detailFooter">
        <button class="btn btn-secondary" onclick="toggleStar()">Toggle Star</button>
        <button class="btn btn-secondary" onclick="editCorrespondence()">Edit</button>
        <button class="btn btn-danger" onclick="deleteCorrespondence()">Delete</button>
      </div>
    </div>
  </div>

  <script src="js/nav-sidebar.js"></script>
  <script src="js/toasts.js"></script>
  <script src="js/correspondence.js"></script>
</body>
</html>
