<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><text y='32' font-size='32'>🏗️</text></svg>">
  <title>Ross Built - Contacts</title>
  <link rel="stylesheet" href="css/styles.css?v=20260119">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-top">
        <div class="header-brand">
          <span class="brand-icon">🏗️</span>
          <span class="brand-name">Ross Built</span>
        </div>
        <nav class="main-nav"></nav>
        <div class="header-actions">
          <button class="btn btn-primary" onclick="openCreateModal()">+ New Contact</button>
        </div>
      </div>
    </header>

    <div class="app-body">
      <main class="main">
        <!-- Stats Bar -->
        <div class="page-header-bar">
          <h1 class="page-title">Contacts</h1>
          <div class="page-header-stats">
            <div class="stat-chip">
              <span class="stat-chip-value" id="statTotal">0</span>
              <span class="stat-chip-label">Total</span>
            </div>
            <div class="stat-chip">
              <span class="stat-chip-value" id="statActive">0</span>
              <span class="stat-chip-label">Active</span>
            </div>
          </div>
        </div>

        <!-- Toolbar with Filters -->
        <div class="data-toolbar">
          <div class="toolbar-left">
            <div class="filter-group">
              <select id="roleFilter" class="form-control form-control-sm">
                <option value="">All Roles</option>
                <option value="client">Client</option>
                <option value="vendor">Vendor</option>
                <option value="subcontractor">Subcontractor</option>
                <option value="architect">Architect</option>
                <option value="engineer">Engineer</option>
                <option value="inspector">Inspector</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="filter-group">
              <select id="statusFilter" class="form-control form-control-sm">
                <option value="">All Status</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
              </select>
            </div>
            <div class="search-input-wrap">
              <input type="text" id="searchInput" placeholder="Search contacts..." class="form-control form-control-sm">
            </div>
          </div>
          <div class="toolbar-right">
            <a href="companies.html" class="btn btn-secondary btn-sm">View Companies</a>
          </div>
        </div>

        <!-- Data Table -->
        <div class="data-table-container">
          <table class="data-table" id="contactTable">
            <thead>
              <tr>
                <th>Name</th>
                <th>Company</th>
                <th>Role</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr><td colspan="6" class="empty-state">Loading contacts...</td></tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <!-- Create/Edit Modal -->
  <div id="contactModal" class="modal modal-fullscreen-dark">
    <div class="modal-content" style="max-width: 600px;">
      <div class="modal-header">
        <h2 id="modalTitle">New Contact</h2>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="contactForm">
          <input type="hidden" id="contactId">

          <div class="form-row">
            <div class="form-group">
              <label for="firstName">First Name *</label>
              <input type="text" id="firstName" name="first_name" class="form-control" required>
            </div>
            <div class="form-group">
              <label for="lastName">Last Name *</label>
              <input type="text" id="lastName" name="last_name" class="form-control" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" class="form-control">
            </div>
            <div class="form-group">
              <label for="phone">Phone</label>
              <input type="tel" id="phone" name="phone" class="form-control">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="mobile">Mobile</label>
              <input type="tel" id="mobile" name="mobile" class="form-control">
            </div>
            <div class="form-group">
              <label for="title">Title</label>
              <input type="text" id="title" name="title" class="form-control" placeholder="e.g., Project Manager">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="companyId">Company</label>
              <select id="companyId" name="company_id" class="form-control">
                <option value="">-- No Company --</option>
              </select>
            </div>
            <div class="form-group">
              <label for="contactRole">Role</label>
              <select id="contactRole" name="contact_role" class="form-control">
                <option value="other">Other</option>
                <option value="client">Client</option>
                <option value="vendor">Vendor</option>
                <option value="subcontractor">Subcontractor</option>
                <option value="architect">Architect</option>
                <option value="engineer">Engineer</option>
                <option value="inspector">Inspector</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="preferredContact">Preferred Contact</label>
              <select id="preferredContact" name="preferred_contact" class="form-control">
                <option value="email">Email</option>
                <option value="phone">Phone</option>
                <option value="mobile">Mobile</option>
              </select>
            </div>
            <div class="form-group">
              <label for="isPrimary">
                <input type="checkbox" id="isPrimary" name="is_primary">
                Primary Contact for Company
              </label>
            </div>
          </div>

          <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" name="address" class="form-control">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="city">City</label>
              <input type="text" id="city" name="city" class="form-control">
            </div>
            <div class="form-group" style="width: 100px;">
              <label for="state">State</label>
              <input type="text" id="state" name="state" class="form-control" maxlength="2">
            </div>
            <div class="form-group" style="width: 120px;">
              <label for="zip">ZIP</label>
              <input type="text" id="zip" name="zip" class="form-control">
            </div>
          </div>

          <div class="form-group">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" class="form-control" rows="3"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="saveContact()">Save Contact</button>
      </div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div id="detailModal" class="modal modal-fullscreen-dark">
    <div class="modal-content" style="max-width: 700px;">
      <div class="modal-header">
        <h2 id="detailTitle">Contact Details</h2>
        <button class="close-btn" onclick="closeDetailModal()">&times;</button>
      </div>
      <div class="modal-body" id="detailBody">
        <!-- Populated by JS -->
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeDetailModal()">Close</button>
        <button type="button" class="btn btn-danger" onclick="deleteCurrentContact()">Delete</button>
        <button type="button" class="btn btn-primary" onclick="editCurrentContact()">Edit</button>
      </div>
    </div>
  </div>

  <!-- Communication Modal -->
  <div id="commModal" class="modal modal-fullscreen-dark">
    <div class="modal-content" style="max-width: 500px;">
      <div class="modal-header">
        <h2>Log Communication</h2>
        <button class="close-btn" onclick="closeCommModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="commForm">
          <div class="form-row">
            <div class="form-group">
              <label for="commType">Type *</label>
              <select id="commType" class="form-control" required>
                <option value="note">Note</option>
                <option value="call">Phone Call</option>
                <option value="email">Email</option>
                <option value="meeting">Meeting</option>
                <option value="text">Text Message</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="form-group">
              <label for="commDirection">Direction</label>
              <select id="commDirection" class="form-control">
                <option value="">-</option>
                <option value="inbound">Inbound</option>
                <option value="outbound">Outbound</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="commDate">Date/Time</label>
              <input type="datetime-local" id="commDate" class="form-control">
            </div>
            <div class="form-group" style="width: 100px;">
              <label for="commDuration">Minutes</label>
              <input type="number" id="commDuration" class="form-control" min="0">
            </div>
          </div>

          <div class="form-group">
            <label for="commSubject">Subject</label>
            <input type="text" id="commSubject" class="form-control" placeholder="Brief subject">
          </div>

          <div class="form-group">
            <label for="commSummary">Summary</label>
            <textarea id="commSummary" class="form-control" rows="2" placeholder="Key points..."></textarea>
          </div>

          <div class="form-group">
            <label for="commBody">Full Notes</label>
            <textarea id="commBody" class="form-control" rows="4" placeholder="Detailed notes..."></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeCommModal()">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="saveComm()">Save</button>
      </div>
    </div>
  </div>

  <script src="js/nav-sidebar.js"></script>
  <script src="js/toasts.js"></script>
  <script src="js/contacts.js"></script>
</body>
</html>
