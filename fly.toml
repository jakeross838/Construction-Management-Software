# =============================================================================
# Ross Built Construction Management Software - Fly.io Configuration
# =============================================================================
# Deploy:   flyctl deploy --remote-only
# Status:   flyctl status
# Logs:     flyctl logs
# SSH:      flyctl ssh console
# Secrets:  flyctl secrets set KEY=VALUE
# =============================================================================

app = "rossbuilt-cms"
primary_region = "mia"

kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"

# -----------------------------------------------------------------------------
# HTTP Service Configuration
# -----------------------------------------------------------------------------
[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

# -----------------------------------------------------------------------------
# Health Check
# -----------------------------------------------------------------------------
[[http_service.checks]]
  grace_period = "30s"
  interval = "15s"
  method = "GET"
  path = "/api/health"
  timeout = "5s"

# -----------------------------------------------------------------------------
# Machine Sizing
# -----------------------------------------------------------------------------
[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
