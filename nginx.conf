# =============================================================================
# Ross Built Construction Management Software - Nginx Reverse Proxy
# =============================================================================
# Used with docker-compose.prod.yml for self-hosted deployments
# Handles SSL termination, compression, and security headers
# =============================================================================

# --------------------------------------------------------------------------
# Upstream: Node.js application
# --------------------------------------------------------------------------
upstream app_server {
    server app:3001;
    keepalive 64;
}

# --------------------------------------------------------------------------
# HTTP -> HTTPS Redirect
# --------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --------------------------------------------------------------------------
# HTTPS Server
# --------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name _;

    # ------------------------------------------------------------------
    # SSL Configuration (Let's Encrypt / Certbot)
    # ------------------------------------------------------------------
    ssl_certificate /etc/letsencrypt/live/rossbuilt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rossbuilt.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ------------------------------------------------------------------
    # Security Headers
    # ------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ------------------------------------------------------------------
    # Gzip Compression
    # ------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ------------------------------------------------------------------
    # Client Settings
    # ------------------------------------------------------------------
    client_max_body_size 50M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # ------------------------------------------------------------------
    # Proxy: API Routes
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://app_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running API calls (e.g., AI invoice processing)
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ------------------------------------------------------------------
    # Proxy: SSE / WebSocket / Realtime
    # ------------------------------------------------------------------
    location /api/realtime {
        proxy_pass http://app_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # SSE support - disable buffering
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # ------------------------------------------------------------------
    # Static Assets (React frontend served by Node.js)
    # ------------------------------------------------------------------
    location / {
        proxy_pass http://app_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
            proxy_pass http://app_server;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ------------------------------------------------------------------
    # Health check (bypass logging)
    # ------------------------------------------------------------------
    location = /api/health {
        proxy_pass http://app_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
