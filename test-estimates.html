<!DOCTYPE html>
<html>
<head>
  <title>Estimates Page Test</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #fff; }
    .test { margin: 10px 0; padding: 10px; border: 1px solid #333; }
    .pass { border-left: 4px solid #0f0; }
    .fail { border-left: 4px solid #f00; }
    .info { border-left: 4px solid #00f; }
  </style>
</head>
<body>
  <h1>Estimates Page Diagnostic</h1>
  <div id="results"></div>

  <script>
    const results = [];

    function test(name, checkFn) {
      try {
        const result = checkFn();
        results.push({ name, status: result ? 'pass' : 'fail', result });
      } catch (err) {
        results.push({ name, status: 'fail', result: err.message });
      }
    }

    function render() {
      const html = results.map(r => `
        <div class="test ${r.status}">
          <strong>${r.status.toUpperCase()}</strong>: ${r.name}
          ${r.result !== true && r.result !== false ? `<br><em>${r.result}</em>` : ''}
        </div>
      `).join('');
      document.getElementById('results').innerHTML = html;
    }

    // Load the page in iframe and test
    const iframe = document.createElement('iframe');
    iframe.src = '/estimates-budget.html';
    iframe.style.display = 'none';
    document.body.appendChild(iframe);

    iframe.onload = () => {
      setTimeout(() => {
        const doc = iframe.contentDocument;
        const win = iframe.contentWindow;

        test('Page loads', () => doc.body !== null);
        test('CSS loaded', () => getComputedStyle(doc.body).backgroundColor !== '');
        test('Scripts loaded', () => win.loadEstimates !== undefined);
        test('Table exists', () => doc.getElementById('estimateTableBody') !== null);
        test('Detail modal exists', () => doc.getElementById('estimateDetailModal') !== null);
        test('Create button exists', () => doc.querySelector('[onclick*="openCreateModal"]') !== null);
        test('Job filter exists', () => doc.getElementById('jobFilter') !== null);
        test('Status filter exists', () => doc.getElementById('statusFilter') !== null);
        test('Search input exists', () => doc.getElementById('searchInput') !== null);
        test('Mode switcher exists', () => doc.querySelector('.mode-switcher') !== null);
        test('Estimates section exists', () => doc.getElementById('estimatesSection') !== null);
        test('Budget section exists', () => doc.getElementById('budgetSection') !== null);

        // Check for JavaScript errors
        const errors = [];
        win.addEventListener('error', (e) => errors.push(e.message));
        test('No JS errors', () => errors.length === 0);

        render();
      }, 2000);
    };
  </script>
</body>
</html>
