# =============================================================================
# Ross Built Construction Management Software - Deploy Pipeline
# Triggered on push to main after CI passes
# =============================================================================

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

env:
  NODE_VERSION: '20.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # Build and Push Docker Image
  # ---------------------------------------------------------------------------
  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Deploy to Production (Placeholder)
  # Configure this section based on your hosting provider:
  # - Railway: Use railway-action
  # - Fly.io: Use flyctl deploy
  # - AWS ECS: Use aws-actions
  # - Azure: Use azure/webapps-deploy
  # - DigitalOcean: Use doctl
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-image
    environment: production  # Requires environment approval in GitHub settings

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------------------
      # Option 1: Railway Deployment
      # Uncomment and configure for Railway
      # -------------------------------------------------------------------------
      # - name: Deploy to Railway
      #   uses: bervProject/railway-deploy@v1
      #   with:
      #     railway_token: ${{ secrets.RAILWAY_TOKEN }}
      #     service: ross-built-cms

      # -------------------------------------------------------------------------
      # Option 2: Fly.io Deployment
      # Uncomment and configure for Fly.io
      # -------------------------------------------------------------------------
      # - name: Deploy to Fly.io
      #   uses: superfly/flyctl-actions/setup-flyctl@master
      # - run: flyctl deploy --remote-only
      #   env:
      #     FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # -------------------------------------------------------------------------
      # Option 3: DigitalOcean App Platform
      # Uncomment and configure for DigitalOcean
      # -------------------------------------------------------------------------
      # - name: Deploy to DigitalOcean
      #   uses: digitalocean/app_action@v1.1.5
      #   with:
      #     app_name: ross-built-cms
      #     token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      # -------------------------------------------------------------------------
      # Placeholder - Configure one of the above options
      # -------------------------------------------------------------------------
      - name: Deployment Placeholder
        run: |
          echo "=================================================="
          echo "  DEPLOYMENT CONFIGURATION REQUIRED"
          echo "=================================================="
          echo ""
          echo "Docker image built and pushed to:"
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo ""
          echo "To enable automated deployment, configure one of:"
          echo "  1. Railway - Add RAILWAY_TOKEN secret"
          echo "  2. Fly.io - Add FLY_API_TOKEN secret and fly.toml"
          echo "  3. DigitalOcean - Add DIGITALOCEAN_ACCESS_TOKEN secret"
          echo "  4. AWS ECS - Configure aws-actions"
          echo ""
          echo "See .github/workflows/deploy.yml for examples"
          echo "=================================================="

  # ---------------------------------------------------------------------------
  # Post-Deploy Health Check
  # ---------------------------------------------------------------------------
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy
    if: false  # Enable when deployment is configured

    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Check application health
        run: |
          # Replace with your production URL
          PRODUCTION_URL="${{ secrets.PRODUCTION_URL }}"

          if [ -z "$PRODUCTION_URL" ]; then
            echo "PRODUCTION_URL secret not set, skipping health check"
            exit 0
          fi

          response=$(curl -s -o /dev/null -w "%{http_code}" "$PRODUCTION_URL/api/health")

          if [ "$response" = "200" ]; then
            echo "Health check passed!"
          else
            echo "Health check failed with status: $response"
            exit 1
          fi
