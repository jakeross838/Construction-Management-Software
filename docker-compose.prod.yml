# =============================================================================
# Ross Built Construction Management Software - Docker Compose (Production)
# =============================================================================
# Self-hosted production deployment with Nginx SSL reverse proxy and Redis.
#
# Usage:
#   docker-compose -f docker-compose.prod.yml up -d
#   docker-compose -f docker-compose.prod.yml logs -f app
#   docker-compose -f docker-compose.prod.yml down
#
# First-time SSL setup:
#   1. Set DNS A record to point your domain to the server
#   2. Comment out the 443 server block in nginx.conf temporarily
#   3. Run: docker-compose -f docker-compose.prod.yml up -d nginx
#   4. Run: docker-compose -f docker-compose.prod.yml run --rm certbot \
#        certonly --webroot -w /var/www/certbot -d rossbuilt.com
#   5. Uncomment the 443 block in nginx.conf
#   6. Run: docker-compose -f docker-compose.prod.yml up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Application Server
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: rossbuilt-cms:latest
    container_name: rossbuilt-cms-prod
    restart: always
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      # Supabase Configuration
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - DATABASE_URL=${DATABASE_URL}
      # API Keys
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SUPABASE_ACCESS_TOKEN=${SUPABASE_ACCESS_TOKEN}
      # Redis
      - REDIS_URL=redis://redis:6379
      # Monitoring
      - SENTRY_DSN=${SENTRY_DSN:-}
    volumes:
      - rossbuilt-uploads:/app/uploads
      - rossbuilt-logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - rossbuilt-network
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy with SSL
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: rossbuilt-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    networks:
      - rossbuilt-network
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Certbot (SSL Certificate Management)
  # ---------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: rossbuilt-certbot
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    # Auto-renew: run via cron or use `docker compose run --rm certbot renew`
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - rossbuilt-network

  # ---------------------------------------------------------------------------
  # Redis Cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: rossbuilt-redis-prod
    restart: always
    expose:
      - "6379"
    volumes:
      - rossbuilt-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rossbuilt-network
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  rossbuilt-uploads:
    driver: local
  rossbuilt-logs:
    driver: local
  rossbuilt-redis:
    driver: local
  certbot-webroot:
    driver: local
  certbot-certs:
    driver: local

networks:
  rossbuilt-network:
    driver: bridge
